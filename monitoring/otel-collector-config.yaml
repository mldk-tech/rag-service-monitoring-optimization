receivers:
  otlp:
    protocols:
      grpc:
        endpoint: "0.0.0.0:4317"
      http:
        endpoint: "0.0.0.0:4318"

processors:
  batch:
    timeout: 1s
    send_batch_size: 1024
  memory_limiter:
    check_interval: 1s
    limit_mib: 1024
  resourcedetection:
    detectors: [env, system]
    timeout: 2s
  filter:
    metrics:
      include:
        match_type: regexp
        metric_names:
          - ".*rag.*"
          - ".*retrieval.*"
          - ".*generation.*"
          - ".*database.*"
          - ".*api.*"
          - ".*security.*"
  attributes:
    actions:
      - key: environment
        value: "${ENVIRONMENT}"
        action: upsert
      - key: service.name
        value: "rag-service"
        action: upsert
      - key: deployment.environment
        value: "${ENVIRONMENT}"
        action: upsert

exporters:
  jaeger:
    endpoint: "jaeger:14250"
    tls:
      insecure: true
  prometheus:
    endpoint: "0.0.0.0:8889"
    namespace: "rag"
    const_labels:
      service: "rag-service"
      environment: "${ENVIRONMENT}"
    send_timestamps: true
    metric_expiration: 180m
    resource_to_telemetry_conversion:
      enabled: true
  logging:
    loglevel: debug
    sampling_initial: 5
    sampling_thereafter: 200
  otlphttp:
    endpoint: "https://api.honeycomb.io"
    headers:
      "x-honeycomb-team": "${HONEYCOMB_API_KEY}"
      "x-honeycomb-dataset": "rag-service"

extensions:
  health_check:
    endpoint: "0.0.0.0:13133"
  pprof:
    endpoint: "0.0.0.0:1777"
  zpages:
    endpoint: "0.0.0.0:55679"

service:
  extensions: [health_check, pprof, zpages]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch, resourcedetection, attributes]
      exporters: [jaeger, otlphttp, logging]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch, resourcedetection, filter, attributes]
      exporters: [prometheus, logging]
  telemetry:
    logs:
      level: "debug"
    metrics:
      level: "detailed"
      address: "0.0.0.0:8888" 