[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "rag-service-monitoring"
version = "0.1.0"
description = "RAG Service with Enhanced Monitoring"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
keywords = ["rag", "nlp", "search", "monitoring", "optimization"]
authors = [
    { name = "Your Organization" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "fastapi>=0.68.0",
    "uvicorn>=0.15.0",
    "elasticsearch>=8.0.0",
    "motor>=3.0.0",
    "redis>=4.0.0",
    "prometheus-client>=0.14.0",
    "structlog>=22.1.0",
    "pydantic>=2.0.0",
    "pybreaker>=0.7.0",
    # OpenTelemetry dependencies (עדכון לגרסה 1.30.0 והסרת Jaeger)
    "opentelemetry-api==1.30.0",
    "opentelemetry-sdk==1.30.0",
    "opentelemetry-instrumentation==0.51b0",
    "opentelemetry-instrumentation-fastapi==0.51b0",
    "opentelemetry-instrumentation-elasticsearch==0.51b0",
    "opentelemetry-instrumentation-redis==0.51b0",
    "opentelemetry-instrumentation-pymongo==0.51b0",
    "opentelemetry-instrumentation-requests==0.51b0",
    "opentelemetry-instrumentation-aiohttp-client==0.51b0",
    "opentelemetry-exporter-otlp==1.30.0",  # במקום opentelemetry-exporter-jaeger
    "opentelemetry-exporter-prometheus==0.51b0",
    "opentelemetry-exporter-gcp-trace==1.9.0",
    "opentelemetry-resourcedetector-gcp==1.9.0a0",
    "google-cloud-trace>=1.11.1",
    # LLM and embedding libraries
    "openai>=1.0.0",
    "anthropic>=0.5.0",
    "sentence-transformers>=2.2.2",
    # Vector database clients
    "pymilvus>=2.3.0",
    "weaviate-client>=3.24.0",
    "qdrant-client>=1.6.0",
    # Graph database client
    "neo4j>=5.13.0",
    # Advanced caching
    "cachetools>=5.3.0",
    # Performance optimization
    "faiss-cpu>=1.7.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.3.1",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=23.3.0",
    "isort>=5.12.0",
    "mypy>=1.3.0",
    "ruff>=0.0.270",
    "poetry>=1.7.0",
]

[tool.black]
line-length = 88
target-version = ["py312"]
include = '\.pyi?$'

[tool.isort]
profile = "black"
multi_line_output = 3

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true

[tool.ruff]
line-length = 100
target-version = "py312"
select = ["E", "F", "B", "I", "N", "UP", "PL", "RUF"]

[tool.hatch.build.targets.wheel]
packages = ["rag_service"]

[tool.poetry]
name = "rag-service-monitoring"
version = "0.1.0"
description = "RAG Service with Enhanced Monitoring"
authors = ["Your Organization"]
readme = "README.md"
packages = [
    { include = "rag_service" }
]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.104.0"
uvicorn = "^0.24.0"
elasticsearch = "^8.10.0"
motor = "^3.3.1"
redis = "^4.0.0"
prometheus-client = "^0.17.1"
structlog = "^23.2.0"
pydantic = "^2.4.2"
pybreaker = "^1.0.1"
# OpenTelemetry עדכני עם OTLP במקום Jaeger
opentelemetry-api = "1.30.0"
opentelemetry-sdk = "1.30.0"
opentelemetry-instrumentation = "0.51b0"
opentelemetry-exporter-otlp = "1.30.0"
