[pytest]
# Test discovery and execution
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    --verbose
    --strict-markers
    --cov=rag_service
    --cov-report=term-missing
    --cov-report=html
    --cov-report=xml
    --cov-branch
    --no-cov-on-fail
    --durations=10
    --maxfail=3
    -ra

# Markers
markers =
    unit: Unit tests
    integration: Integration tests
    e2e: End-to-end tests
    slow: Tests that take longer than 1 second
    api: API endpoint tests
    retrieval: Retrieval functionality tests
    generation: Generation functionality tests
    security: Security-related tests
    optimization: Optimization functionality tests
    monitoring: Monitoring functionality tests

# Test categories
[test-categories]
unit = tests/unit
integration = tests/integration
e2e = tests/e2e

# Coverage settings
[coverage:run]
branch = True
source = rag_service
omit =
    */tests/*
    */migrations/*
    */__init__.py
    */settings.py
    */wsgi.py
    */asgi.py
    */manage.py

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise NotImplementedError
    if __name__ == .__main__.:
    pass
    raise ImportError
    except ImportError:
    def main
show_missing = True
fail_under = 80

# Environment variables for tests
[test-env]
ENVIRONMENT = test
LOG_LEVEL = DEBUG
DISABLE_EXTERNAL_CALLS = true

# Logging configuration
[log-cli]
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Custom settings
[custom]
slow_test_threshold = 1.0
max_test_duration = 300.0
parallel_test_count = 4 